<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root { --text: #1f2328; --muted: #59636e; --line: #d1d9e0; --link: #0969da; --code: #f6f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: #fff;
           font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    header, main, footer { max-width: 820px; margin: 0 auto; padding: 0 20px; }
    header { padding-top: 22px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
             display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    header a.brand { font-weight: 600; font-size: 18px; color: var(--text); text-decoration: none; }
    nav a { margin-left: 18px; }
    main { padding-top: 8px; padding-bottom: 32px; }
    h1 { font-size: 28px; line-height: 1.25; margin: 24px 0 12px; }
    h2 { font-size: 20px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
    a { color: var(--link); }
    code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 90%; }
    img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
    footer { padding-top: 14px; padding-bottom: 28px; border-top: 1px solid var(--line);
             color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav><a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/PRIVACY.html' | relative_url }}">Privacy Policy</a></nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer>
    &copy; 2026 {{ site.title }} &middot; <a href="{{ '/PRIVACY.html' | relative_url }}">Privacy Policy</a>
    &middot; <a href="mailto:doxuankinh@gmail.com">doxuankinh@gmail.com</a>
  </footer>
</body>
</html>
